name: Windows CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m laser_detection.check_environment
      - run: python -m compileall -q src tests
      - run: >-
          python -c "import importlib, pkgutil, laser_detection;
          [importlib.import_module(m.name) for m in
          pkgutil.walk_packages(laser_detection.__path__, laser_detection.__name__ + '.')]"
      - run: python -m pytest -q
