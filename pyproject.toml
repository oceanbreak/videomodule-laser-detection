[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-dataset-inspector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "plotly>=6", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
dev = ["jupyterlab>=4", "ipywidgets>=8", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
